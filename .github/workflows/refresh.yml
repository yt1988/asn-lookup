# The lookup data (public/data/, built by `npm run data` at deploy) comes from files RIPE NCC, the RIRs and
# iptoasn.com refresh every day. Committing the date once a day makes Cloudflare Workers Builds rebuild and deploy.
name: Daily data refresh
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%dT%H:%MZ > data.stamp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.stamp
          git commit -m "Data refresh $(cat data.stamp)" || exit 0
          git push
