# Cloudflare Worker: static pages and lookup data from ./public (served without running the script: free, unmetered)
# plus src/worker.js for the AS and address pages and /api/*. No routes or custom domain here: on 1ms.dog the site
# routes the domain to this Worker. To self-host, bind your own domain in the dashboard (see README).
# public/data/ and the sitemaps are built by `npm run data` (not committed): run it before deploying.
name = "asn-lookup"
main = "src/worker.js"
compatibility_date = "2025-10-01"
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"

# [vars]
# SITE_URL = "https://asn.example.com"   # your own address, for canonical links (also pass it to the build: SITE_URL=… npm run build)
